# Microsoft Foundry deployments used by the benchmarks (pay-per-token; reused if they already exist).
# Used by: make deploy-foundry-models  ->  scripts/deploy_foundry.py (Azure CLI)
# Account: AZ_RESOURCE_GROUP and AZ_FOUNDRY_ACCOUNT in .env. Blank version = newest offered by the account.

[[deployments]]
name     = "gpt-5"          # baseline
model    = "gpt-5"
version  = ""
sku      = "GlobalStandard"
capacity = 50               # thousands of tokens per minute

[[deployments]]
name     = "gpt-6-sol"      # blind judge for the Amazon benchmark
model    = "gpt-6-sol"
version  = ""
sku      = "GlobalStandard"
capacity = 50
