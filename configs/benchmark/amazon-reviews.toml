# Benchmark: Qwen3-4B base vs fine-tuned vs GPT-5 + blind GPT-6 Sol judge.
task       = "amazon"
test       = "evaluation/qwen3-4b-amazon-v2/test_evaluation_103.jsonl"
limit      = 103                     # override with LIMIT=10
output_dir = "evaluation/reruns/amazon-reviews"
workers    = 4

[[models]]
label      = "qwen3_4b_base"
provider   = "fireworks"
deployment = "qwen3-4b-base"
max_tokens = 500

[[models]]
label      = "qwen3_4b_finetuned"
provider   = "fireworks"
model      = "ft-qwen3-4b-amazon-reviews"
deployment = "qwen3-4b-ft-adapters"
max_tokens = 500

[[models]]
label      = "gpt5"
provider   = "foundry"
deployment = "${FOUNDRY_GPT5_DEPLOYMENT}"
max_tokens = 8000                  # includes hidden reasoning tokens

[judge]
name       = "gpt6sol_with_gpt5"
deployment = "${FOUNDRY_GPT6_SOL_DEPLOYMENT}"
candidates = ["qwen3_4b_base", "qwen3_4b_finetuned", "gpt5"]
