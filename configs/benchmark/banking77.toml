# Benchmark: Qwen3-4B base vs fine-tuned vs GPT-5.
task       = "banking77"
test       = "data/banking77/test.jsonl"
limit      = 3080                     # override with LIMIT=10
output_dir = "evaluation/reruns/banking77"
workers    = 8

[[models]]
label      = "qwen3_4b_base"
provider   = "fireworks"
deployment = "qwen3-4b-base"
prompt     = "label_list"               # base model needs the 77 labels in the prompt
max_tokens = 20

[[models]]
label      = "qwen3_4b_finetuned"
provider   = "fireworks"
model      = "ft-qwen3-4b-banking77"
deployment = "qwen3-4b-banking77"
max_tokens = 20

[[models]]
label      = "gpt5"
provider   = "foundry"
deployment = "${FOUNDRY_GPT5_DEPLOYMENT}"
prompt     = "label_list"
max_tokens = 2000                  # includes hidden reasoning tokens
