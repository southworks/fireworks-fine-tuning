# The fine-tuned models behind the published results (trained before this repo), on one GPU (multi-LoRA).
# Use it to re-run the benchmark without training: make deploy-published-models exec-benchmark-published
name                 = "qwen3-4b-ft-published"
strategy             = "addons"
base_model           = "accounts/fireworks/models/qwen3-4b"
adapters             = ["ft-qwen3-4b-amazon-v2", "ft-qwen3-4b-banking-validation"]
shape                = "default"
min_replicas         = 0
max_replicas         = 1
scale_to_zero_window = "10m"
display_name         = "Qwen3-4B published fine-tuned adapters"
