# The fine-tuned models trained by this repo, served together on one GPU (multi-LoRA).
# A Qwen3-4B deployment with add-ons enabled; each adapter is loaded with `firectl model load-lora`.
# Query an adapter as accounts/<account>/models/<adapter>#accounts/<account>/deployments/<name>.
# Multi-LoRA is available through firectl and the SDK, not through the Fireworks web UI.
name                 = "qwen3-4b-ft-adapters"
strategy             = "addons"
base_model           = "accounts/fireworks/models/qwen3-4b"
adapters             = ["ft-qwen3-4b-amazon-reviews", "ft-qwen3-4b-banking77"]
shape                = "default"                             # add-ons need a BF16 shape; if creation fails, pick one from
                                                             # firectl deployment-shape-version list --base-model <base_model>
min_replicas         = 0
max_replicas         = 1
scale_to_zero_window = "10m"
display_name         = "Qwen3-4B fine-tuned adapters"
